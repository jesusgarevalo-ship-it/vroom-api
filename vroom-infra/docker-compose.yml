# ============================================
# VROOM Repuestos Express - Docker Compose
# ============================================
# Desarrollo local y staging

services:
  # -----------------------------------------
  # PostgreSQL 15
  # -----------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: vroom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vroom
      POSTGRES_PASSWORD: vroom123
      POSTGRES_DB: vroom_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vroom -d vroom_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vroom-network

  # -----------------------------------------
  # Redis 7
  # -----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: vroom-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vroom-network

  # -----------------------------------------
  # API (Node.js + Fastify)
  # -----------------------------------------
  api:
    build:
      context: ../vroom-api
      dockerfile: ../vroom-infra/Dockerfile
    container_name: vroom-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://vroom:vroom123@postgres:5432/vroom_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-vroom-jwt-secret-change-in-production}
      BCV_FALLBACK_RATE: ${BCV_FALLBACK_RATE:-50}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - vroom-network

# -----------------------------------------
# Volumes persistentes
# -----------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# -----------------------------------------
# Red compartida
# -----------------------------------------
networks:
  vroom-network:
    driver: bridge